apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-microservice-app
  namespace: default
  labels:
    app.kubernetes.io/name: my-microservice-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: my-microservice-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-microservice-app
    spec:
      containers:
        - name: app
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app-repo:sha-a1b2c3d
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"